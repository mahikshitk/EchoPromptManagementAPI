name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            infra/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r infra/requirements.txt
          npm ci

      - name: Test
        run: pytest -q

      # Synth with placeholder values: checks the stack builds without AWS credentials (nothing is looked up)
      - name: Synthesize CDK
        run: |
          npx cdk synth PromptManagement-ci --quiet \
            -c environment=ci -c account=123456789012 -c region=eu-west-2 \
            -c vpcId=vpc-0123456789abcdef0 \
            -c privateSubnetIds=subnet-0123456789abcdef0,subnet-0123456789abcdef1 \
            -c privateSubnetAvailabilityZones=eu-west-2a,eu-west-2b \
            -c databaseLambdaSecurityGroupId=sg-0123456789abcdef0 \
            -c atrionDbSecretArn=arn:aws:secretsmanager:eu-west-2:123456789012:secret:atrion-db-AbCdEf \
            -c openRouterSecretArn=arn:aws:secretsmanager:eu-west-2:123456789012:secret:openrouter-AbCdEf \
            -c userPoolId=eu-west-2_AbCdEfGhI \
            -c interactiveClientId=interactiveclient -c adminClientId=adminclient
