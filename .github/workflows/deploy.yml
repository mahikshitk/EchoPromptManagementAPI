name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and deployment suffix
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: prompt-management-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      VPC_ID: ${{ vars.VPC_ID }}
      PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
      PRIVATE_SUBNET_AVAILABILITY_ZONES: ${{ vars.PRIVATE_SUBNET_AVAILABILITY_ZONES }}
      DATABASE_LAMBDA_SECURITY_GROUP_ID: ${{ vars.DATABASE_LAMBDA_SECURITY_GROUP_ID }}
      ATRION_DB_SECRET_ARN: ${{ vars.ATRION_DB_SECRET_ARN }}
      OPENROUTER_SECRET_ARN: ${{ vars.OPENROUTER_SECRET_ARN }}
      USER_POOL_ID: ${{ vars.USER_POOL_ID }}
      INTERACTIVE_CLIENT_ID: ${{ vars.INTERACTIVE_CLIENT_ID }}
      ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}  # optional; every origin (*) when empty
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}  # optional; the code's default model when empty
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          missing=()
          for name in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID VPC_ID PRIVATE_SUBNET_IDS \
                      PRIVATE_SUBNET_AVAILABILITY_ZONES DATABASE_LAMBDA_SECURITY_GROUP_ID \
                      ATRION_DB_SECRET_ARN OPENROUTER_SECRET_ARN USER_POOL_ID INTERACTIVE_CLIENT_ID \
                      ADMIN_CLIENT_ID; do
            [ -n "${!name// /}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub environment variables: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            infra/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt -r infra/requirements.txt
          npm ci

      - name: Test
        run: pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Builds the Lambda image with the runner's Docker, pushes it to the CDK bootstrap ECR repository,
      # then updates the stack
      - name: Deploy CDK
        run: |
          npx cdk deploy "PromptManagement-${DEPLOY_ENVIRONMENT}" \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            -c environment="${DEPLOY_ENVIRONMENT}" \
            -c account="${AWS_ACCOUNT_ID}" \
            -c region="${AWS_REGION}" \
            -c vpcId="${VPC_ID}" \
            -c privateSubnetIds="${PRIVATE_SUBNET_IDS}" \
            -c privateSubnetAvailabilityZones="${PRIVATE_SUBNET_AVAILABILITY_ZONES}" \
            -c databaseLambdaSecurityGroupId="${DATABASE_LAMBDA_SECURITY_GROUP_ID}" \
            -c atrionDbSecretArn="${ATRION_DB_SECRET_ARN}" \
            -c openRouterSecretArn="${OPENROUTER_SECRET_ARN}" \
            -c userPoolId="${USER_POOL_ID}" \
            -c interactiveClientId="${INTERACTIVE_CLIENT_ID}" \
            -c adminClientId="${ADMIN_CLIENT_ID}" \
            -c corsAllowedOrigins="${CORS_ALLOWED_ORIGINS}" \
            -c openRouterModel="${OPENROUTER_MODEL}"

      - name: Smoke test
        run: |
          api_url="$(jq -r '.["PromptManagement-'"${DEPLOY_ENVIRONMENT}"'"].ApiUrl' cdk-outputs.json)"
          printf 'API: %s\n\nSwagger: %s/docs\n' "${api_url}" "${api_url}" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${api_url}/health"
          curl --fail --silent --show-error --output /dev/null "${api_url}/docs"

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: prompt-management-${{ inputs.environment }}-outputs
          path: cdk-outputs.json
          retention-days: 14
